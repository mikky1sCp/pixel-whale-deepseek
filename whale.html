<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пиксельный кит в очках и худи</title>
<style>
  /* ============================================================
     ПАЛИТРА
     ============================================================ */
  :root {
    --whale-dark:   #0b2545;
    --whale-light:  #5ec8f7;
    --whale-white:  #ffffff;
    --whale-yellow: #ffd23f;
  }

  /* ============================================================
     КОНТЕЙНЕР ВИДЖЕТА
     ============================================================ */
  #whale-widget {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 64px;
    height: 64px;
    z-index: 9999;
    pointer-events: none;
    transition: opacity .4s ease, transform .4s ease;
  }
  #whale-widget.hidden {
    opacity: 0;
    transform: translateY(24px) scale(.7);
  }

  #whaleCanvas {
    display: block;
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
    transform-origin: 50% 100%;
  }

  /* --- idle --- */
  #whale-widget.mood-idle #whaleCanvas {
    animation: whaleBob 2.4s ease-in-out infinite;
  }
  @keyframes whaleBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

  /* --- thinking --- */
  #whale-widget.mood-thinking #whaleCanvas {
    animation: whaleThink 2.8s ease-in-out infinite;
  }
  @keyframes whaleThink {
    0%, 100% { transform: translateY(0)    rotate(-1.5deg); }
    50%      { transform: translateY(-2px) rotate(1.5deg);  }
  }

  /* --- happy: БАГ #2 — конечная анимация (2 прохода),
         вместо infinite; возврат в idle делает JS-таймер --- */
  #whale-widget.mood-happy #whaleCanvas {
    animation: whaleJump .85s ease-in-out 2;
  }
  @keyframes whaleJump {
    0%   { transform: translateY(0)     scale(1, 1); }
    15%  { transform: translateY(0)     scale(1.08, .92); }
    40%  { transform: translateY(-16px) scale(.95, 1.05); }
    65%  { transform: translateY(-18px) scale(1, 1); }
    85%  { transform: translateY(0)     scale(1.06, .94); }
    100% { transform: translateY(0)     scale(1, 1); }
  }

  /* ============================================================
     ПУЗЫРИ
     ============================================================ */
  .whale-bubbles {
    position: absolute;
    left: 22px;
    top: 6px;
    width: 1px;
    height: 1px;
  }
  .bubble {
    position: absolute;
    left: 0;
    top: 0;
    width: 6px;
    height: 6px;
    background: var(--whale-white);
    box-shadow: inset 0 0 0 2px rgba(94, 200, 247, .85);
    opacity: 0;
    animation-name: bubbleRise;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }
  @keyframes bubbleRise {
    0%   { transform: translate(0, 0) scale(.4);                                 opacity: 0; }
    20%  {                                                                       opacity: 1; }
    100% { transform: translate(var(--drift, 0px), var(--rise, -62px)) scale(1); opacity: 0; }
  }

  /* ============================================================
     ПИКСЕЛЬНАЯ ЛАМПОЧКА
     ============================================================ */
  .whale-bulb {
    position: absolute;
    left: 26px;
    top: -30px;
    width: 4px;
    height: 4px;
    background: transparent;
    box-shadow:
       8px  0    0 0 var(--whale-yellow),
       4px  4px  0 0 var(--whale-yellow),
       8px  4px  0 0 var(--whale-yellow),
      12px  4px  0 0 var(--whale-yellow),
       4px  8px  0 0 var(--whale-yellow),
       8px  8px  0 0 var(--whale-yellow),
      12px  8px  0 0 var(--whale-yellow),
       8px 12px  0 0 var(--whale-yellow),
       8px 16px  0 0 var(--whale-yellow);
    opacity: 0;
    transform: scale(.4);
    transition: opacity .25s ease, transform .25s ease;
  }
  #whale-widget.mood-thinking .whale-bulb {
    opacity: 1;
    transform: scale(1);
    animation: bulbGlow 1.2s ease-in-out infinite;
  }
  @keyframes bulbGlow {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(255, 210, 63, .6)); }
    50%      { filter: drop-shadow(0 0 10px rgba(255, 210, 63, 1)); }
  }

  /* ============================================================
     КНОПКА «УСЫПИТЬ» (крестик)
     ============================================================ */
  #whaleSleep {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 18px;
    height: 18px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 700 12px/1 monospace;
    color: var(--whale-white);
    background: var(--whale-dark);
    border: 2px solid var(--whale-light);
    border-radius: 0;
    cursor: pointer;
    pointer-events: auto;
    opacity: .55;
    transition: opacity .2s ease, transform .2s ease;
  }
  #whaleSleep:hover {
    opacity: 1;
    transform: scale(1.15);
  }

  /* ============================================================
     БАГ #1: КНОПКА «РАЗБУДИТЬ» — пиксель в углу, виден всегда
     ============================================================ */
  #whaleWake {
    position: fixed;
    right: 4px;
    bottom: 4px;
    width: 14px;
    height: 14px;
    padding: 0;
    background: #777;
    border: 2px solid #aaa;
    border-radius: 0;
    cursor: pointer;
    z-index: 9998;
    opacity: .35;
    image-rendering: pixelated;
    transition: opacity .3s ease, transform .2s ease, background .3s ease;
  }
  #whaleWake:hover {
    opacity: 1;
    transform: scale(1.2);
    background: var(--whale-light);
  }
  #whaleWake.pulse {
    opacity: .95;
    background: var(--whale-yellow);
    border-color: var(--whale-yellow);
    animation: wakePulse 1.4s ease-in-out infinite;
  }
  @keyframes wakePulse {
    0%, 100% { opacity: .55; transform: scale(1);    }
    50%      { opacity: 1;   transform: scale(1.25); }
  }

  /* ============================================================
     ДЕМО-ПАНЕЛЬ (для тестирования состояний)
     ============================================================ */
  #whaleDemoPanel {
    position: fixed;
    top: 20px;
    left: 20px;
    font: 14px/1.4 monospace;
    z-index: 10000;
    background: rgba(11, 37, 69, .92);
    color: var(--whale-white);
    padding: 10px 12px;
    border: 2px solid var(--whale-light);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    max-width: 360px;
  }
  #whaleDemoPanel .label {
    width: 100%;
    font-weight: 700;
    color: var(--whale-yellow);
    margin-bottom: 2px;
  }
  #whaleDemoPanel button {
    font: inherit;
    font-weight: 700;
    padding: 4px 9px;
    background: var(--whale-light);
    color: var(--whale-dark);
    border: 2px solid var(--whale-dark);
    border-radius: 0;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }
  #whaleDemoPanel button:hover {
    background: var(--whale-yellow);
    transform: translateY(-1px);
  }
</style>
</head>
<body>

<!-- ============================================================
     ДЕМО-ПАНЕЛЬ
     ============================================================ -->
<div id="whaleDemoPanel">
  <div class="label">🐋 Управление китом</div>
  <button type="button" data-mood="idle">idle</button>
  <button type="button" data-mood="thinking">thinking</button>
  <button type="button" data-mood="happy">happy</button>
  <button type="button" data-action="sleep">sleep</button>
  <button type="button" data-action="wake">wake</button>
</div>

<!-- ============================================================
     ВИДЖЕТ С КИТОМ
     ============================================================ -->
<div id="whale-widget" class="mood-idle">
  <div class="whale-bubbles" id="whaleBubbles"></div>
  <div class="whale-bulb" aria-hidden="true"></div>
  <canvas id="whaleCanvas" width="64" height="64" aria-label="Пиксельный кит"></canvas>
  <button id="whaleSleep" type="button" title="Усыпить кита" aria-label="Усыпить кита">×</button>
</div>

<!-- БАГ #1: всегда видимая кнопка-пиксель для пробуждения -->
<button id="whaleWake" type="button" title="Усыпить кита" aria-label="Переключить сон кита"></button>

<script>
(function () {
  'use strict';

  /* ============================================================
     ССЫЛКИ НА DOM
     ============================================================ */
  const widget      = document.getElementById('whale-widget');
  const canvas      = document.getElementById('whaleCanvas');
  const ctx         = canvas.getContext('2d');
  const bubbleLayer = document.getElementById('whaleBubbles');
  const sleepBtn    = document.getElementById('whaleSleep');
  const wakeBtn     = document.getElementById('whaleWake');
  const demoPanel   = document.getElementById('whaleDemoPanel');

  const STORAGE_KEY = 'pixelWhale:asleep';

  /* ============================================================
     ПАЛИТРА И ПИКСЕЛЬНЫЕ КАРТЫ
     ============================================================ */
  const COLORS = { d: '#0b2545', l: '#5ec8f7', w: '#ffffff', y: '#ffd23f' };
  const PIX = 4; // 16 × 4 = 64px

  /* БАГ #4: хвост с зазором + контур — стал читаемее */
  const BASE = [
    '................', // 0
    '.......w........', // 1
    '......w.w.......', // 2
    '.......w........', // 3
    '....dddddd......', // 4
    '..dddddddddd....', // 5
    '.ddlllllllldd...', // 6
    '.ddlllllllldd..l', // 7  ← зазор + контурный пиксель
    '.ddlllllllldd.ll', // 8  ← плавник
    '.ddlllllllldd..l', // 9  ← зазор + контурный пиксель
    '.ddlllllllldd...', // 10
    '..dddddddddd....', // 11
    '...dddddddd.....', // 12
    '....dddddd......', // 13
    '................', // 14
    '................'  // 15
  ];

  const GLASSES = ['yyy.yyy', 'ywy.ywy', 'yyy.yyy'];
  const GLASSES_X = 3;
  const GLASSES_Y = 7;

  /* ============================================================
     ОТРИСОВКА
     ============================================================ */
  function paint(grid, originX, originY, shiftY) {
    for (let y = 0; y < grid.length; y++) {
      const row = grid[y];
      for (let x = 0; x < row.length; x++) {
        const color = COLORS[row[x]];
        if (!color) continue;
        ctx.fillStyle = color;
        ctx.fillRect((originX + x) * PIX, (originY + y + shiftY) * PIX, PIX, PIX);
      }
    }
  }

  function draw(glassesShiftY) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    paint(BASE, 0, 0, 0);
    paint(GLASSES, GLASSES_X, GLASSES_Y, glassesShiftY || 0);
  }

  draw(0);

  /* ============================================================
     СОСТОЯНИЯ
     ============================================================ */
  let mood       = 'idle';
  let rafId      = null;
  let frame      = 0;
  let lastShift  = null;   // БАГ #3: перерисовываем только при смене сдвига
  let happyTimer = null;   // БАГ #2: таймер авто-возврата из happy

  /* БАГ #3: экономим перерисовку — рисуем только когда shift меняется */
  function thinkingLoop() {
    frame++;
    const shift = (frame % 120) < 10 ? -1 : 0;
    if (shift !== lastShift) {
      draw(shift);
      lastShift = shift;
    }
    rafId = requestAnimationFrame(thinkingLoop);
  }

  function stopThinkingLoop() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
    // БАГ #3: сбрасываем, иначе первый кадр при повторном thinking
    // не отрисуется (shift=0 совпадёт с застрявшим lastShift=0)
    lastShift = null;
  }

  /**
   * Публичный метод переключения настроения.
   * @param {'idle'|'thinking'|'happy'} next
   */
  function setMood(next) {
    if (next !== 'idle' && next !== 'thinking' && next !== 'happy') return;

    // БАГ #2: сбрасываем предыдущий таймер happy
    if (happyTimer) {
      clearTimeout(happyTimer);
      happyTimer = null;
    }

    mood = next;
    widget.classList.remove('mood-idle', 'mood-thinking', 'mood-happy');
    widget.classList.add('mood-' + next);

    stopThinkingLoop();
    if (next === 'thinking') {
      frame = 0;
      thinkingLoop();
    } else {
      draw(0);
    }

    // БАГ #2: happy — сразу большой пузырь + брызги и авто-возврат в idle
    if (next === 'happy') {
      spawnBubble(18, 2200, 96);
      for (let i = 0; i < 3; i++) {
        setTimeout(function () { spawnBubble(6, 1800, 70); }, i * 130);
      }
      happyTimer = setTimeout(function () {
        happyTimer = null;
        setMood('idle');
      }, 2000);
    }
  }

  /* ============================================================
     ПУЗЫРИ
     ============================================================ */
  function spawnBubble(size, duration, distance) {
    size     = size     || 6;
    duration = duration || 2600;
    distance = distance || 62;

    const b = document.createElement('div');
    b.className = 'bubble';
    b.style.width  = size + 'px';
    b.style.height = size + 'px';
    b.style.left   = (Math.random() * 18 - 9) + 'px';
    b.style.animationDuration = duration + 'ms';
    b.style.setProperty('--rise',  '-' + distance + 'px');
    b.style.setProperty('--drift', (Math.random() * 14 - 7) + 'px');

    bubbleLayer.appendChild(b);
    b.addEventListener('animationend', function () { b.remove(); });
  }

  setInterval(function () {
    if (widget.classList.contains('hidden')) return;
    if (mood === 'idle') {
      spawnBubble(6, 2400, 58);
    } else if (mood === 'thinking') {
      if (Math.random() < 0.4) spawnBubble(4, 2000, 42);
    }
  }, 750);

  /* ============================================================
     «УСЫПЛЕНИЕ» / «ПРОБУЖДЕНИЕ» + localStorage
     ============================================================ */
  function safeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function safeRemove(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  /** Синхронизирует подсказку у кнопки-пикселя с текущим состоянием */
  function syncWakeBtnTitle() {
    if (widget.classList.contains('hidden')) {
      wakeBtn.title = 'Разбудить кита';
    } else {
      wakeBtn.title = 'Усыпить кита';
    }
  }

  function sleep() {
    widget.classList.add('hidden');
    safeSet(STORAGE_KEY, '1');
    wakeBtn.classList.add('pulse');   // БАГ #1: привлекаем внимание
    syncWakeBtnTitle();
  }

  function wake() {
    widget.classList.remove('hidden');
    safeRemove(STORAGE_KEY);
    wakeBtn.classList.remove('pulse');
    syncWakeBtnTitle();
    setMood('idle');
  }

  /* Крестик на самом ките */
  sleepBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    sleep();
  });

  /* БАГ #1: кнопка-пиксель в углу — тоггл сон/бодрствование */
  wakeBtn.addEventListener('click', function () {
    if (widget.classList.contains('hidden')) {
      wake();
    } else {
      sleep();
    }
  });

  /* Восстановление из localStorage */
  if (safeGet(STORAGE_KEY) === '1') {
    widget.classList.add('hidden');
    wakeBtn.classList.add('pulse');
  }
  syncWakeBtnTitle();

  /* ============================================================
     ДЕМО-ПАНЕЛЬ
     ============================================================ */
  demoPanel.addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;

    if (btn.dataset.mood) {
      if (widget.classList.contains('hidden')) wake();
      setMood(btn.dataset.mood);
    } else if (btn.dataset.action === 'sleep') {
      sleep();
    } else if (btn.dataset.action === 'wake') {
      wake();
    }
  });

  /* ============================================================
     ПУБЛИЧНЫЙ API
     ============================================================ */
  window.whale = {
    setMood: setMood,
    sleep:   sleep,
    wake:    wake
  };

  setMood('idle');
})();
</script>

</body>
</html>
